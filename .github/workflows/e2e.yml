name: E2E Smoke (Tier 0)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  e2e-smoke:
    name: E2E Smoke (Tier 0)
    runs-on: ubuntu-latest
    # Validates this repo's tests against Backend/Frontend main — never a PR branch on
    # those repos (that's more CI maturity than this project needs yet). Mirrors the
    # e2e-smoke job in RowingFederation-Backend/.github/workflows/ci.yml and
    # RowingFederation-Frontend/.github/workflows/ci-frontend.yml; keep the three in sync.
    steps:
      - name: Checkout E2E suite (self)
        uses: actions/checkout@v4
        with:
          path: RowingFederation-E2E

      - name: Checkout Backend (main)
        uses: actions/checkout@v4
        with:
          repository: CoLAB-Sacramento/RowingFederation-Backend
          ref: main
          token: ${{ secrets.E2E_CROSS_REPO_PAT }}
          path: RowingFederation-Backend

      - name: Checkout Frontend (main)
        uses: actions/checkout@v4
        with:
          repository: benedettoadrian/RowingFederation-Frontend
          ref: main
          token: ${{ secrets.E2E_CROSS_REPO_PAT }}
          path: RowingFederation-Frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: RowingFederation-E2E/package-lock.json

      - name: Install E2E dependencies
        working-directory: RowingFederation-E2E
        run: npm ci

      - name: Install Playwright browsers
        working-directory: RowingFederation-E2E
        run: npx playwright install --with-deps chromium

      - name: Start stack
        working-directory: RowingFederation-E2E
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for backend health
        working-directory: RowingFederation-E2E
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health && exit 0
            sleep 2
          done
          echo "Backend did not become healthy in time" >&2
          exit 1

      - name: Seed fixtures
        working-directory: RowingFederation-E2E
        run: npm run seed

      - name: Run Tier 0 E2E tests
        working-directory: RowingFederation-E2E
        run: npm run test:e2e:tier0

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: RowingFederation-E2E/playwright-report/
          retention-days: 7

      - name: Dump stack logs on failure
        if: failure()
        working-directory: RowingFederation-E2E
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Tear down stack
        if: always()
        working-directory: RowingFederation-E2E
        run: docker compose -f docker-compose.e2e.yml down -v
