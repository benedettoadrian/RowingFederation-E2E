# =================================================================
# ROWING FEDERATION E2E — Cross-repo integration stack
# =================================================================
# Builds the real Backend + Frontend production images (siblings checked
# out at ../RowingFederation-Backend and ../RowingFederation-Frontend —
# same convention the Backend repo's own dev docker-compose.yml already
# uses for ../RowingFederation-OCR) against a disposable test Postgres and
# a deterministic OCR stub (see ocr-stub/README notes in server.ts).
#
# Ports are offset from the normal dev stack (5432/3000/5173/8001) so this
# can run locally alongside an existing `docker compose up` in the Backend
# repo without colliding.
#
# Test-only RSA keypairs below — never used outside this compose file, not
# production secrets. Same practice already used in the Backend repo's own
# CI workflow (.github/workflows/ci.yml, unit-tests job).
# =================================================================

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: e2e-postgres
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: rowing_e2e
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d rowing_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - e2e-network

  ocr-stub:
    build:
      context: ./ocr-stub
    container_name: e2e-ocr-stub
    ports:
      - "8002:8001"
    environment:
      PORT: 8001
    networks:
      - e2e-network

  # S3-compatible double for Cloudflare R2 — real R2 has a fixed
  # <account>.r2.cloudflarestorage.com endpoint, not something a test stack
  # can point at, so CloudflareR2StorageService gained an endpoint override
  # (CLOUDFLARE_R2_ENDPOINT_OVERRIDE) specifically for this. Unlocks running
  # the backend as NODE_ENV=production for real here — see the `backend`
  # service comment below for why that matters beyond storage.
  #
  # Was MinIO (quay.io/minio/minio + quay.io/minio/mc) until 2026-09-24, when
  # MinIO locked down anonymous pulls of those images on quay.io too (Docker
  # Hub had already been blocked for a while — see git history). Confirmed at
  # the registry-protocol level: quay.io issues an anonymous token with
  # `actions: []` for minio/minio, not a transient rate limit. Switched to
  # Adobe's S3Mock, which still allows anonymous pulls and — unlike MinIO —
  # doesn't enforce any auth on requests by default, so no credentials/signing
  # setup is needed for the app's plain `${publicUrl}/${filePath}` downloads
  # (CloudflareR2StorageService.getDownloadUrl never signs; MinIO needed the
  # `mc anonymous set download` bucket policy for this to work, S3Mock just
  # allows it out of the box). No bucket policy support in S3Mock at all —
  # confirmed CreateBucket/PutObject/HeadObject/CopyObject/ListObjectsV2 (the
  # only operations CloudflareR2StorageService actually uses) all work fine
  # against it.
  s3-mock:
    image: adobe/s3mock:latest
    container_name: e2e-s3mock
    ports:
      - "9000:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - e2e-network

  # One-shot init container: creates the bucket S3Mock doesn't have by
  # default and exits. `backend` waits on this completing, not on `s3-mock`
  # directly, so the bucket is guaranteed to exist before the app starts.
  # S3Mock doesn't enforce auth on any request, so a plain unsigned `curl -X
  # PUT` (no aws-cli/mc, no credentials) is enough to create the bucket.
  s3-init:
    image: curlimages/curl:latest
    container_name: e2e-s3-init
    depends_on:
      s3-mock:
        condition: service_healthy
    entrypoint: >
      sh -c "
        curl -sf -X PUT http://s3-mock:9090/fedururemo-e2e
      "
    networks:
      - e2e-network

  backend:
    build:
      context: ../RowingFederation-Backend
      dockerfile: Dockerfile
    container_name: e2e-backend
    ports:
      - "3001:3000"
    environment:
      # Real "production" mode, not a stand-in — S3Mock above is what makes
      # this possible without a real Cloudflare R2 bucket (see comment on
      # the `s3-mock` service). This also un-inerts NODE_ENV==="production"
      # -gated behavior elsewhere, notably the strict 10-req/15min login
      # rate limiter (rate-limit.middleware.ts) — Fase 7.2's rate-limiting
      # test can run against this stack now instead of needing staging.
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://e2e:e2e@postgres-test:5432/rowing_e2e
      DATABASE_URL_DIRECT: postgresql://e2e:e2e@postgres-test:5432/rowing_e2e
      CORS_ORIGIN: http://localhost:5174
      FRONTEND_URL: http://localhost:5174
      OCR_SERVICE_URL: http://ocr-stub:8001
      LOG_LEVEL: warn
      RATE_LIMIT_WINDOW_MS: 900000
      # 1000 was enough for CI's tier0-only smoke subset but a full local run
      # (tier0 + tier1, ~150 specs) legitimately makes more requests than that
      # inside one 15-min window and started tripping 429s mid-suite.
      RATE_LIMIT_MAX_REQUESTS: 10000
      # The real production login limiter (10/15min/IP) would block the
      # login.spec.ts suite, which logs in as all 11 fixture roles from a
      # single IP in one run. Overridden here only — see env.config.ts.
      LOGIN_RATE_LIMIT_MAX_OVERRIDE: "1000"
      # documentUploadRateLimiter is normally 20/15min/user in production —
      # a full tier0+tier1 run uploads far more than that per fixture user
      # (nationality-eligibility.spec.ts, document-identity-change.spec.ts,
      # etc.) inside one window, tripping UPLOAD_RATE_LIMIT_EXCEEDED 429s
      # mid-suite. Overridden here only — see env.config.ts.
      DOCUMENT_UPLOAD_RATE_LIMIT_MAX_OVERRIDE: "1000"
      # S3Mock doesn't enforce auth at all — these credentials are never
      # actually checked, kept only because the SDK client requires some
      # value to be configured.
      CLOUDFLARE_R2_ACCOUNT_ID: e2e
      CLOUDFLARE_R2_ACCESS_KEY_ID: e2etest
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: e2etest
      CLOUDFLARE_R2_BUCKET_NAME: fedururemo-e2e
      CLOUDFLARE_R2_PUBLIC_URL: http://localhost:9000/fedururemo-e2e
      CLOUDFLARE_R2_ENDPOINT_OVERRIDE: http://s3-mock:9090
      CLOUDFLARE_R2_FORCE_PATH_STYLE: "true"
      JWT_ALGORITHM: RS256
      JWT_ACCESS_TOKEN_EXPIRES_IN: 15m
      JWT_REFRESH_TOKEN_EXPIRES_IN: 7d
      JWT_ACCESS_PRIVATE_KEY: |
