  frontend:
    build:
      context: ../RowingFederation-Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_APP_NAME: "FUR - Sistema Agazzi (E2E)"
        NEXT_PUBLIC_APP_URL: http://localhost:5174
    container_name: e2e-frontend
    ports:
      - "5174:5173"
    depends_on:
      - backend
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge
